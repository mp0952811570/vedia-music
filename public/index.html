<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vedia Music</title>
  <meta name="description" content="Vedia Music — Music lives here">
  <meta name="theme-color" content="#0b0b0c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vedia">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <img src="/icons/logo-mark.png" alt="" class="brand-mark">
    <span class="brand">Vedia</span>
    <form id="searchForm" class="search" autocomplete="off">
      <input id="searchInput" type="search" enterkeyhint="search" placeholder="搜尋歌曲、歌手…">
    </form>
  </header>

  <nav class="tabs">
    <button data-tab="home" class="on">首頁</button>
    <button data-tab="search">搜尋</button>
    <button data-tab="playlists">歌單</button>
    <button data-tab="liked">收藏</button>
    <button data-tab="queue">播放佇列</button>
    <button data-tab="history">最近播放</button>
    <button data-tab="users" class="hidden">朋友</button>
  </nav>

  <main id="list" class="list"></main>

  <footer id="mini" class="mini hidden">
    <div class="mini-progress"><div id="miniBar"></div></div>
    <div class="mini-row">
      <img id="miniCover" alt="">
      <div class="mini-meta" id="miniOpen">
        <div id="miniTitle" class="t1"></div>
        <div id="miniArtist" class="t2"></div>
      </div>
      <button id="miniPlay" class="icon-btn" aria-label="播放/暫停"></button>
      <button id="miniNext" class="icon-btn" aria-label="下一首"></button>
    </div>
  </footer>

  <section id="full" class="full" aria-hidden="true">
    <div class="full-bg" id="fullBg"></div>
    <div class="full-inner">
      <div class="full-head">
        <button id="fullClose" class="icon-btn" aria-label="收起"></button>
        <div class="seg">
          <button data-view="cover" class="on">歌曲</button>
          <button data-view="lyrics">歌詞</button>
        </div>
        <div class="head-right">
          <button id="addPlBtn" class="icon-btn sm" aria-label="加入歌單"></button>
          <button id="likeBtn" class="icon-btn" aria-label="收藏"></button>
        </div>
      </div>

      <div class="focus-bar">
        <img id="focusCover" alt="">
        <div class="meta"><div id="focusTitle" class="t1"></div><div id="focusArtist" class="t2"></div></div>
        <button id="focusExit" class="icon-btn sm" aria-label="離開全螢幕歌詞"></button>
      </div>

      <div class="views">
        <div class="view-cover on" id="viewCover">
          <img id="fullCover" alt="">
          <div class="mini-lyric" id="miniLyric"></div>
        </div>
        <div class="view-lyrics" id="viewLyrics">
          <div class="lyrics" id="lyrics"></div>
          <div class="lyric-tools">
            <button id="lySource" class="ly-source">歌詞</button>
            <button id="offMinus" aria-label="歌詞提早 0.5 秒">-0.5</button>
            <span id="offVal">0.0s</span>
            <button id="offPlus" aria-label="歌詞延後 0.5 秒">+0.5</button>
            <button id="transBtn">翻譯</button>
            <button id="lyFocus" class="icon-btn sm" aria-label="全螢幕歌詞"></button>
          </div>
        </div>
      </div>

      <div class="full-meta">
        <div id="fullTitle" class="t1"></div>
        <div id="fullArtist" class="t2"></div>
      </div>

      <div class="seekwrap">
        <input id="seek" type="range" min="0" max="1000" value="0" aria-label="進度">
        <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
      </div>

      <div class="controls">
        <button id="prevBtn" class="icon-btn" aria-label="上一首"></button>
        <button id="back10Btn" class="icon-btn skip" aria-label="倒轉 10 秒"></button>
        <button id="playBtn" class="play-btn" aria-label="播放/暫停"></button>
        <button id="fwd10Btn" class="icon-btn skip" aria-label="快轉 10 秒"></button>
        <button id="nextBtn" class="icon-btn" aria-label="下一首"></button>
      </div>
      <div class="modes">
        <button id="shuffleBtn" class="mode" aria-label="隨機播放"></button>
        <button id="repeatBtn" class="mode" aria-label="循環播放"></button>
      </div>
      <div class="status" id="status"></div>
    </div>
  </section>

  <div id="toast" class="toast"></div>
  <audio id="audio" preload="auto" playsinline></audio>
  <script src="/app.js" type="module"></script>
</body>
</html>
